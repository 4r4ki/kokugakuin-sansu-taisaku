<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算数マスター</title>
  <link rel="stylesheet" href="css/style.css?v=2.5.0">
</head>
<body>
  <header class="app-header">
    <h1>算数マスター <span class="sub">中学入試・算数対策</span></h1>
    <nav class="sections" aria-label="コーナー">
      <button data-section="noudo" class="section-tab active">
        <span class="section-name">濃度マスター</span>
        <span class="section-desc">食塩水の問題・練習</span>
      </button>
      <button data-section="hard" class="section-tab">
        <span class="section-name">難問チャレンジ</span>
        <span class="section-desc">角度・面積・特殊算など</span>
      </button>
    </nav>
    <nav class="tabs" data-section="noudo" aria-label="濃度マスターのメニュー">
      <button data-view="list" class="tab active">問題</button>
      <button data-view="practice" class="tab">練習（自動）</button>
      <button data-view="tips" class="tab">解き方のコツ</button>
    </nav>
    <nav class="tabs" data-section="hard" aria-label="難問チャレンジのメニュー" hidden>
      <button data-view="hard" class="tab">問題</button>
      <button data-view="guide" class="tab">解き方ガイド</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="app-footer">
    <span id="progress"></span>
    <span class="version">v2.5.0</span>
    <button id="reset" class="link">記録をリセット</button>
  </footer>

  <script src="js/problems.js?v=2.5.0"></script>
  <script src="js/hard-problems.js?v=2.5.0"></script>
  <script src="js/guides.js?v=2.5.0"></script>
  <script src="js/guides-more.js?v=2.5.0"></script>
  <script src="js/generator.js?v=2.5.0"></script>
  <script src="js/app.js?v=2.5.0"></script>
</body>
</html>
