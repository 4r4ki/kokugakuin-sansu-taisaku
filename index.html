<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>濃度マスター</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>濃度マスター <span class="sub">中学入試・算数対策</span></h1>
    <nav class="tabs">
      <button data-view="list" class="tab active">問題</button>
      <button data-view="tips" class="tab">解き方のコツ</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="app-footer">
    <span id="progress"></span>
    <button id="reset" class="link">記録をリセット</button>
  </footer>

  <script src="js/problems.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
