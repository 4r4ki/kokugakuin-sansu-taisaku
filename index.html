<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算数マスター</title>
  <link rel="stylesheet" href="css/style.css?v=2.0.0">
</head>
<body>
  <header class="app-header">
    <h1>算数マスター <span class="sub">中学入試・算数対策</span></h1>
    <nav class="tabs">
      <button data-view="list" class="tab active">濃度</button>
      <button data-view="hard" class="tab">難問</button>
      <button data-view="practice" class="tab">練習（自動）</button>
      <button data-view="tips" class="tab">解き方のコツ</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="app-footer">
    <span id="progress"></span>
    <span class="version">v2.0.0</span>
    <button id="reset" class="link">記録をリセット</button>
  </footer>

  <script src="js/problems.js?v=2.0.0"></script>
  <script src="js/hard-problems.js?v=2.0.0"></script>
  <script src="js/generator.js?v=2.0.0"></script>
  <script src="js/app.js?v=2.0.0"></script>
</body>
</html>
